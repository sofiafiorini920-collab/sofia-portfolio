<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
</head>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My beautiful website</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 90vh;
            animation: changeBackground 15s infinite;
            background-size: cover;
            background-position: center;
        }

        @keyframes changeBackground {
            0% {
                background-image: url('images/IMG1.jpg.jpg');
            }
            33% {
                background-image: url('images/IMG2.jpg.jpg');
            }
            66% {
                background-image: url('images/IMG3.jpg.jpg');
            }
            100% {
                background-image: url('images/IMG4.jpg.jpg');
            }
        }
    </style>
</head>
<body>
    <h1 style="color: white; text-align: center; padding-top: 50px;">
        Your Content Here
    </h1>
</body>
</html>
