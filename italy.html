<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Italy - Gallery</title>
    <link rel="stylesheet" href="gallery.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-logo">MY PORTFOLIO</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="contact.html">Contact</a>
        </div>
    </nav>

    <div class="page-header">
        <h1 class="page-title">Italy</h1>
        <p class="page-subtitle">Renaissance & Romance</p>
    </div>

    <div class="gallery">
        <div class="gallery-grid">
            
            <div class="photo" onclick="openLightbox(0)">
                <img src="images/italy/IMG_2328-2.jpg" alt="Italy 1">
            </div>

            <div class="photo" onclick="openLightbox(1)">
                <img src="images/italy/IMG_2330.jpg" alt="Italy 2">
            </div>

            <div class="photo" onclick="openLightbox(2)">
                <img src="images/italy/IMG_2340.jpg" alt="Italy 3">
            </div>

            <div class="photo" onclick="openLightbox(3)">
                <img src="images/italy/IMG_2381.jpg" alt="Italy 4">
            </div>

            <div class="photo" onclick="openLightbox(4)">
                <img src="images/italy/IMG_2488-3.jpg" alt="Italy 5">
            </div>

            <div class="photo" onclick="openLightbox(5)">
                <img src="images/italy/IMG_2564.jpg" alt="Italy 6">
            </div>

            <div class="photo" onclick="openLightbox(6)">
                <img src="images/italy/IMG_2569.jpg" alt="Italy 7">
            </div>

            <!-- Aggiungi altre foto -->

        </div>
    </div>

    <div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
        <span class="lightbox-close" onclick="closeLightbox(event)">×</span>
        <span class="lightbox-nav lightbox-prev" onclick="changeImage(-1, event)">‹</span>
        <div class="lightbox-content">
            <img id="lightbox-img" src="" alt="">
        </div>
        <span class="lightbox-nav lightbox-next" onclick="changeImage(1, event)">›</span>
    </div>

    <footer>
        <p>&copy; 2024 My Photography Portfolio. All rights reserved.</p>
    </footer>

    <script>
        const images = [
            'images/italy/IMG_2328-2.jpg',
            'images/italy/IMG_2330.jpg',
            'images/italy/IMG_2340.jpg',
            'images/italy/IMG_2381.jpg',
            'images/italy/IMG_2488-3.jpg',
            'images/italy/IMG_2564.jpg',
            'images/italy/IMG_2569.jpg'
        ];
    </script>
    <script src="gallery.js"></script>

</body>
</html>
